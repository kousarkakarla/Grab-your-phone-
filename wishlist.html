<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Wishlist – Grab Your Mobile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="wishlist">
  <div id="site-header"></div>

  <main class="container my-4">
    <h1 class="h3 mb-3">My Wishlist <small class="text-muted fs-6" id="wish-count"></small></h1>
    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3" id="wish-grid"></div>
    <div id="wish-empty" class="empty-state d-none">
      <i class="bi bi-heart"></i>
      <h5>Your wishlist is empty</h5>
      <p class="text-muted">Tap the heart on any phone to save it here.</p>
      <a href="index.html#shop" class="btn btn-primary">Browse phones</a>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function renderWishlist() {
      const ids = getWishlist();
      document.getElementById("wish-grid").innerHTML = ids.map((id) => productCard(getProduct(id))).join("");
      document.getElementById("wish-empty").classList.toggle("d-none", ids.length > 0);
      document.getElementById("wish-count").textContent = ids.length ? `(${ids.length})` : "";
    }
    document.addEventListener("DOMContentLoaded", () => {
      renderWishlist();
      bindProductActions(document.getElementById("wish-grid"), renderWishlist);
    });
  </script>
</body>
</html>
