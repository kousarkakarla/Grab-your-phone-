<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Cart – Grab Your Mobile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="cart">
  <div id="site-header"></div>

  <main class="container my-4">
    <h1 class="h3 mb-3">My Cart <small class="text-muted fs-6" id="cart-count"></small></h1>
    <div class="row g-4" id="cart-layout">
      <div class="col-lg-8">
        <div class="card" id="cart-items"></div>
      </div>
      <div class="col-lg-4">
        <div class="card summary-card">
          <div class="card-body">
            <h6 class="text-muted text-uppercase fw-bold small mb-3">Price details</h6>
            <div id="summary"></div>

            <form class="mt-3" id="coupon-form">
              <label class="form-label small fw-semibold" for="coupon-input">Have a coupon?</label>
              <div class="input-group">
                <input type="text" class="form-control text-uppercase" id="coupon-input" placeholder="Enter code (try GRAB10)">
                <button class="btn btn-outline-primary" type="submit">Apply</button>
              </div>
              <div id="coupon-msg" class="small mt-1"></div>
            </form>

            <a href="checkout.html" class="btn btn-orange btn-lg w-100 mt-3 fw-semibold" id="checkout-btn">Place Order</a>
            <p class="small text-muted mt-2 mb-0"><i class="bi bi-shield-lock"></i> Safe and secure checkout. Easy returns.</p>
          </div>
        </div>
      </div>
    </div>

    <div id="empty-cart" class="empty-state d-none">
      <i class="bi bi-cart-x"></i>
      <h5>Your cart is empty</h5>
      <p class="text-muted">Add phones to your cart to buy them.</p>
      <a href="index.html#shop" class="btn btn-primary">Shop now</a>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
